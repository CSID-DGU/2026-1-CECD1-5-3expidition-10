<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLM 도서관 서고 모니터링 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .tab-btn.active { border-bottom: 2px solid #3B82F6; color: #3B82F6; font-weight: bold; }
        .status-normal { background-color: #DEF7EC; color: #03543F; }
        .status-error { background-color: #FDE8E8; color: #9B1C1C; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <nav class="bg-white shadow-md p-4 flex justify-between items-center">
        <div class="text-xl font-bold text-blue-600">
            <i class="fa-solid fa-robot mr-2"></i> 지능형 서고 관리 시스템 (VLM)
        </div>
        <div class="text-sm text-gray-500">
            <i class="fa-solid fa-circle text-green-500 text-xs mr-1"></i> 서버 연결됨
        </div>
    </nav>

    <div class="container mx-auto p-6">
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow p-6 border-l-4 border-blue-500">
                <h3 class="text-gray-500 text-sm font-semibold mb-1">총 스캔 세션</h3>
                <p class="text-3xl font-bold" id="stat-sessions">0</p>
            </div>
            <div class="bg-white rounded-lg shadow p-6 border-l-4 border-green-500">
                <h3 class="text-gray-500 text-sm font-semibold mb-1">점검 완료 도서</h3>
                <p class="text-3xl font-bold" id="stat-books">0</p>
            </div>
            <div class="bg-white rounded-lg shadow p-6 border-l-4 border-red-500">
                <h3 class="text-gray-500 text-sm font-semibold mb-1">발견된 문제 도서 (오배열/누락 등)</h3>
                <p class="text-3xl font-bold text-red-600" id="stat-issues">0</p>
            </div>
        </div>

        <h2 class="text-lg font-bold text-gray-700 mb-3"><i class="fa-solid fa-clipboard-list mr-2"></i>사서 조치 필요 항목</h2>
        <div id="librarian-tasks" class="mb-8 flex flex-col gap-2">
            </div>

        <div class="bg-white rounded-t-lg shadow border-b border-gray-200 px-6 pt-4">
            <div class="flex space-x-6">
                <button onclick="changeTab('results')" id="tab-results" class="tab-btn active pb-3 px-1 text-gray-600 hover:text-blue-600">🎯 최종 분석 결과</button>
                <button onclick="changeTab('sessions')" id="tab-sessions" class="tab-btn pb-3 px-1 text-gray-600 hover:text-blue-600">📂 세션 현황</button>
                <button onclick="changeTab('vision')" id="tab-vision" class="tab-btn pb-3 px-1 text-gray-600 hover:text-blue-600">👁️ Vision 원본 데이터</button>
                <button onclick="changeTab('rfid')" id="tab-rfid" class="tab-btn pb-3 px-1 text-gray-600 hover:text-blue-600">📡 RFID 원본 데이터</button>
                <button onclick="fetchData()" class="ml-auto pb-3 px-1 text-blue-500 hover:text-blue-700 font-bold"><i class="fa-solid fa-rotate-right"></i> 새로고침</button>
            </div>
        </div>

        <div class="bg-white rounded-b-lg shadow overflow-x-auto">
            <table class="min-w-full text-sm text-left">
                <thead class="bg-gray-100 text-gray-600 font-medium border-b" id="table-head">
                </thead>
                <tbody class="divide-y divide-gray-200" id="table-body">
                </tbody>
            </table>
            <div id="loading" class="text-center py-10 text-gray-500 hidden">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>데이터를 불러오는 중입니다...
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8000/api/dashboard";
        let currentTab = 'results';
        let dbData = { sessions: [], results: [], vision: [], rfid: [] };

        // 페이지 로드 시 데이터 가져오기
        window.onload = fetchData;

        async function fetchData() {
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('table-body').innerHTML = '';
            
            try {
                const [resSess, resRes, resVis, resRfid] = await Promise.all([
                    fetch(`${API_BASE}/sessions`).then(r => r.json()),
                    fetch(`${API_BASE}/results`).then(r => r.json()),
                    fetch(`${API_BASE}/vision`).then(r => r.json()),
                    fetch(`${API_BASE}/rfid`).then(r => r.json())
                ]);

                dbData.sessions = resSess; 
                dbData.results = resRes; 
                dbData.vision = resVis; 
                dbData.rfid = resRfid;

                updateStats();
                
                // 🌟 [추가됨] 데이터를 다 불러온 직후, 사서 알림판을 업데이트합니다!
                updateLibrarianTaskBoard(dbData.results);
                
                renderTable();
            } catch (error) {
                console.error("데이터 로드 실패:", error);
                alert("백엔드 서버(FastAPI)가 실행 중인지 확인해주세요!");
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        // 🌟 [수정됨] 사서 업무 알림판 생성 함수 (누락/오배열 판별 강화)
        function updateLibrarianTaskBoard(results) {
            const taskContainer = document.getElementById("librarian-tasks");
            taskContainer.innerHTML = ""; 
            let anomalyCount = 0;

            results.forEach((book) => {
                let taskMessage = "";
                let iconClass = "fa-triangle-exclamation";
                
                // 데이터가 비어있을(null) 경우를 대비한 안전 장치
                const seq = book.sequence_order ? `${book.sequence_order}번째 자리` : `위치 미상(누락 됨)`;
                const bId = book.book_id || "알 수 없음";
                const visual = book.visual_status || "";
                const sync = book.sync_status || "";
                const finalStat = book.final_status || ""; // 백엔드가 주는 최종 판별 결과

                // 1. 물리적 상태 이상 (Vision AI)
                if (visual === "abnormal_upside") {
                    taskMessage = `📍 <b>[뒤집힘]</b> <b>${seq}</b>의 책(ID: ${bId})이 거꾸로 꽂혀 있습니다. 바로 세워주세요.`;
                } else if (visual === "abnormal_tilted") {
                    taskMessage = `📍 <b>[기울어짐]</b> <b>${seq}</b>의 책(ID: ${bId})이 심하게 기울어져 쓰러질 위험이 있습니다.`;
                } else if (visual === "abnormal_stack" || visual === "abnormal_paper") {
                    taskMessage = `📍 <b>[이물질/가로배치]</b> <b>${seq}</b>에 책이 가로로 쌓여있거나 이물질이 있습니다.`;
                }
                
                // 2. 데이터 융합 이상 (final_status와 sync_status를 모두 꼼꼼히 확인!)
                else if (finalStat.includes("오배열") || sync.includes("MISPLACED") || sync.includes("오배열")) {
                    taskMessage = `📍 <b>[오배열]</b> <b>${seq}</b>에 다른 책이 잘못 꽂혀 있습니다. (현재 인식된 책: ${bId})`;
                    iconClass = "fa-shuffle";
                } else if (finalStat.includes("누락") || sync.includes("MISSING") || sync.includes("누락")) {
                    taskMessage = `📍 <b>[분실/누락 의심]</b> RFID는 감지되었으나, <b>${bId}</b> 도서의 실제 책등 인식을 실패했습니다. 확인이 필요합니다.`;
                    iconClass = "fa-eye-slash";
                }

                // 문제가 있을 경우에만 UI에 카드 추가
                if (taskMessage) {
                    anomalyCount++;
                    const taskCard = document.createElement("div");
                    taskCard.className = "p-4 rounded-lg border-l-4 border-red-500 bg-red-50 flex items-center shadow-sm";
                    taskCard.innerHTML = `
                        <i class="fa-solid ${iconClass} text-red-600 mr-3 text-lg"></i>
                        <div class="text-sm text-red-700">${taskMessage}</div>
                    `;
                    taskContainer.appendChild(taskCard);
                }
            });

            // 문제가 발견되지 않았을 경우 칭찬 메시지 출력
            if (anomalyCount === 0 && results.length > 0) {
                taskContainer.innerHTML = `
                    <div class="p-4 rounded-lg bg-green-50 border-l-4 border-green-500 flex items-center shadow-sm">
                        <i class="fa-solid fa-circle-check text-green-600 mr-3 text-lg"></i>
                        <div class="text-sm text-green-700">현재 서가에 정돈이 필요한 도서가 없습니다. 서가가 완벽한 상태입니다! ✨</div>
                    </div>
                `;
            } else if (results.length === 0) {
                taskContainer.innerHTML = `
                    <div class="p-4 rounded-lg bg-gray-50 border-l-4 border-gray-400 flex items-center shadow-sm">
                        <i class="fa-solid fa-circle-info text-gray-500 mr-3 text-lg"></i>
                        <div class="text-sm text-gray-600">아직 분석된 데이터가 없습니다. 무인 스캔을 시작해주세요.</div>
                    </div>
                `;
            }
        }
        
        function updateStats() {
            document.getElementById('stat-sessions').innerText = dbData.sessions.length;
            document.getElementById('stat-books').innerText = dbData.results.length;
            const issues = dbData.results.filter(r => r.final_status !== '정상' && r.final_status !== '대출 중 (정상)');
            document.getElementById('stat-issues').innerText = issues.length;
        }

        function changeTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
            currentTab = tabName;
            renderTable();
        }

        function renderTable() {
            const head = document.getElementById('table-head');
            const body = document.getElementById('table-body');
            head.innerHTML = ''; body.innerHTML = '';

            const data = dbData[currentTab];
            if (!data || data.length === 0) {
                body.innerHTML = '<tr><td colspan="10" class="px-6 py-8 text-center text-gray-500">데이터가 없습니다.</td></tr>';
                return;
            }

            // 테이블 헤더 동적 생성
            const keys = Object.keys(data[0]);
            let trHead = '<tr>';
            keys.forEach(k => { trHead += `<th class="px-6 py-3">${k.toUpperCase()}</th>`; });
            trHead += '</tr>';
            head.innerHTML = trHead;

            // 테이블 본문 생성
            data.forEach(row => {
                let trBody = '<tr class="hover:bg-gray-50">';
                keys.forEach(k => {
                    let val = row[k];
                    // 상태 값에 따른 색상 라벨링
                    if (k === 'final_status' || k === 'visual_status' || k === 'sync_status') {
                        const isNormal = val === '정상' || val === 'normal' || val === 'SUCCESS';
                        const badgeClass = isNormal ? 'status-normal' : 'status-error';
                        val = `<span class="px-2 py-1 rounded text-xs font-semibold ${badgeClass}">${val}</span>`;
                    }
                    trBody += `<td class="px-6 py-4 whitespace-nowrap">${val ?? '-'}</td>`;
                });
                trBody += '</tr>';
                body.innerHTML += trBody;
            });
        }
    </script>
</body>
</html>
