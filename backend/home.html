<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 서가 · 서고 모니터링</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/assets/common.js?v=20261108b"></script>
    <script src="/assets/app.js?v=20261108b"></script>
</head>
<!-- 첫 화면: "어디로 가야 하나" — 정리가 필요한 층 목록, 도서관 지도, 층별 상태. 층을 누르면 층 화면(/level)으로 이동 -->
<body class="bg-slate-50 text-slate-800 min-h-screen">
    <div id="top-bar"></div>

    <main class="max-w-6xl mx-auto px-4 md:px-8 py-6 md:py-8">
        <div class="flex flex-wrap items-end justify-between gap-4 mb-6">
            <div>
                <div id="today" class="text-sm text-slate-500"></div>
                <h1 id="headline" class="text-2xl md:text-3xl font-bold text-slate-900 mt-1">불러오는 중...</h1>
            </div>
            <!-- 순찰 사진 수신함 → 일괄 분석 -->
            <div class="flex flex-col items-end gap-1.5">
                <div class="flex items-center gap-3 text-sm text-slate-500">
                    <span id="inbox-text"></span>
                    <button id="analyze-btn" onclick="startBatchAnalysis()" disabled
                            class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2.5 rounded-xl flex items-center gap-1.5 disabled:bg-slate-300 disabled:cursor-not-allowed">
                        <i id="analyze-icon" class="fa-solid fa-play"></i> <span id="analyze-text">지금 분석</span>
                    </button>
                </div>
                <div id="inbox-progress" class="text-xs text-slate-500 w-72 max-w-full"></div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <section class="lg:col-span-8 flex flex-col gap-3" id="work-list"></section>

            <aside class="lg:col-span-4 flex flex-col gap-4">
                <div class="bg-white rounded-2xl border border-slate-200 p-5">
                    <div class="flex items-center justify-between mb-3">
                        <h2 class="font-bold">도서관 지도</h2>
                        <span id="map-hint" class="text-xs text-slate-400 hidden"><i class="fa-solid fa-magnifying-glass-plus"></i> 눌러서 크게</span>
                    </div>
                    <img id="map-img" alt="도서관 전체 지도" class="hidden w-full rounded-lg border border-slate-100 cursor-zoom-in"
                         onload="onMapLoaded(true)" onerror="onMapLoaded(false)">
                    <div id="map-empty" class="text-sm text-slate-400 text-center py-6"><i class="fa-regular fa-map text-3xl block mb-2"></i>등록된 지도가 없습니다.</div>
                </div>

                <div class="bg-white rounded-2xl border border-slate-200 p-5">
                    <div class="flex items-center justify-between gap-2 mb-4">
                        <h2 class="font-bold">층별 상태</h2>
                        <div id="zone-tabs" class="flex flex-wrap gap-1 text-xs font-semibold"></div>
                    </div>
                    <div id="zone-name" class="text-xs text-slate-500 -mt-2 mb-3"></div>
                    <div id="mini-map" class="flex gap-2 overflow-x-auto pb-1"></div>
                    <div id="legend" class="flex flex-wrap gap-x-3 gap-y-1 mt-4 text-[11px] text-slate-500"></div>
                    <div class="text-xs text-slate-400 mt-3">칸을 누르면 그 층 화면으로 이동해요 · 맨 아래가 1층</div>
                </div>
            </aside>
        </div>
    </main>

    <script>
        const REFRESH_MS = 20000;
        const POLL_MS = 3000;
        let ME = null;
        let tree = [];
        let activeZoneId = null;
        let showAllOk = false;
        let patrolRunning = false;
        let patrolProgress = -1;
        let patrolTimer = null;

        // 층별 상태 칸 색 (미니맵)
        const CELL = {
            pending_action: "bg-rose-400 text-white", retake: "bg-orange-400 text-white", pending_check: "bg-amber-300 text-amber-900",
            ok: "bg-emerald-200 text-emerald-800", no_reference: "bg-violet-200 text-violet-800",
            unpatrolled: "bg-slate-100 text-slate-400", no_books: "bg-slate-50 text-slate-300",
        };

        function chipsFor(level) {
            if (level.status === "retake") {
                const reasons = level.latest_session?.quality?.reasons || [];
                return `<span class="text-sm font-semibold px-2.5 py-1 rounded-lg bg-orange-100 text-orange-700">사진을 다시 찍어야 함</span>`
                    + (reasons[0] ? `<span class="text-xs text-slate-400 self-center">${escapeHtml(reasons[0])}</span>` : "");
            }
            if (level.status === "no_reference") {
                return `<span class="text-sm font-semibold px-2.5 py-1 rounded-lg bg-violet-100 text-violet-700">정상 상태 기준 사진 없음</span>`
                    + `<span class="text-xs text-slate-400 self-center">${ME.is_admin ? "관리 화면에서 등록해 주세요" : "관리자에게 알려 주세요"}</span>`;
            }
            const byGroup = level.latest_session?.summary.pending_by_group || {};
            return DASHBOARD_GROUP_ORDER.filter(g => byGroup[g.key]).map(g =>
                `<span class="text-sm font-semibold px-2.5 py-1 rounded-lg ${g.badge}">${g.title} <b>${byGroup[g.key]}</b></span>`).join("");
        }

        function workCard(level, first) {
            const t = levelTitle(level);
            const work = WORK_STATUSES.has(level.status);
            const stripe = { pending_action: "bg-rose-400", retake: "bg-orange-400", pending_check: "bg-amber-300", no_reference: "bg-violet-300" }[level.status];
            const when = level.latest_session ? `${formatTime(level.latest_session.scan_time)} 순찰` : "";
            const a = document.createElement("a");
            a.href = levelUrl(level);
            a.className = `bg-white rounded-2xl border p-4 md:p-5 flex items-center gap-4 md:gap-5 hover:border-indigo-300 transition-colors `
                + (first ? "border-indigo-300 ring-4 ring-indigo-50" : "border-slate-200") + (work ? "" : " opacity-90");
            a.innerHTML = `
                <div class="w-1.5 self-stretch rounded-full ${stripe}"></div>
                <div class="flex-1 min-w-0">
                    <div class="flex flex-wrap items-baseline gap-x-2">
                        <span class="text-lg md:text-xl font-bold text-slate-900">${t.zone} ${t.main}</span>
                        <span class="text-sm text-slate-400">${escapeHtml(level.zone.zone_name || "")}${when ? " · " + when : ""}</span>
                    </div>
                    <div class="flex flex-wrap gap-1.5 mt-2.5">${chipsFor(level)}</div>
                </div>
                <span class="shrink-0 text-sm font-semibold px-3 md:px-4 py-2.5 rounded-xl ${first ? "bg-indigo-600 text-white" : "bg-slate-100 text-slate-700"}">
                    <span class="hidden sm:inline">보러 가기</span> <i class="fa-solid fa-arrow-right sm:ml-1"></i></span>`;
            return a;
        }

        function renderWorkList() {
            const levels = flattenLevels(tree);
            const todo = attentionLevels(levels);
            const work = todo.filter(l => WORK_STATUSES.has(l.status));
            const light = todo.filter(l => !WORK_STATUSES.has(l.status));
            const count = s => levels.filter(l => l.status === s).length;

            document.getElementById("headline").innerHTML = levels.length === 0
                ? "등록된 서가가 없어요"
                : work.length ? `정리가 필요한 곳 <span class="text-rose-600">${work.length}층</span>` : `오늘은 정리할 곳이 없어요 <span class="text-emerald-600">✓</span>`;

            const box = document.getElementById("work-list");
            box.innerHTML = "";
            if (levels.length === 0) {
                box.innerHTML = `<div class="bg-white rounded-2xl border border-dashed border-slate-300 p-8 text-center text-slate-500">
                    <i class="fa-solid fa-building-columns text-3xl text-slate-300 mb-2 block"></i>
                    ${ME.is_admin ? `<a href="/classic" class="text-indigo-600 font-semibold">관리 화면</a>에서 구역 · 책꽂이 · 층을 먼저 만들어 주세요.` : "관리자가 도서관 구조를 등록하면 여기에 표시됩니다."}</div>`;
                return;
            }
            work.forEach((l, i) => box.appendChild(workCard(l, i === 0)));
            if (work.length === 0) {
                box.innerHTML = `<div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-6 flex items-center gap-4 text-emerald-800">
                    <i class="fa-solid fa-circle-check text-3xl text-emerald-500"></i>
                    <div><div class="font-bold text-lg">모든 층이 정돈되어 있어요</div><div class="text-sm">최근 순찰에서 정리할 책이 발견되지 않았습니다.</div></div></div>`;
            }
            if (light.length) {
                const label = document.createElement("div");
                label.className = "text-xs font-semibold text-slate-400 mt-2";
                label.textContent = "확인만 하면 되는 곳";
                box.appendChild(label);
                light.forEach(l => box.appendChild(workCard(l, false)));
            }

            // 나머지 층 요약 (정상 · 미순찰 · 도서 없음) — 펼치면 정상 층 목록
            const ok = levels.filter(l => l.status === "ok");
            const summary = document.createElement("div");
            summary.className = "rounded-2xl border border-dashed border-slate-300 px-5 py-4 text-sm text-slate-500 mt-1";
            summary.innerHTML = `
                <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
                    <span><i class="fa-solid fa-circle-check text-emerald-500"></i> 정상 <b class="text-slate-700">${ok.length}</b></span>
                    <span class="text-slate-300">|</span><span>미순찰 <b class="text-slate-700">${count("unpatrolled")}</b></span>
                    ${count("no_books") ? `<span class="text-slate-300">|</span><span>도서 없음 <b class="text-slate-700">${count("no_books")}</b></span>` : ""}
                    ${ok.length ? `<button id="toggle-ok" class="ml-auto text-indigo-600 font-semibold">${showAllOk ? "접기" : "정상 층 보기"} <i class="fa-solid fa-chevron-${showAllOk ? "up" : "down"} text-xs"></i></button>` : ""}
                </div>
                ${showAllOk ? `<div class="flex flex-wrap gap-1.5 mt-3">${ok.map(l => `<a href="${levelUrl(l)}" class="text-xs px-2.5 py-1 rounded-lg bg-white border border-slate-200 hover:border-indigo-300">${levelTitle(l).zone} ${levelTitle(l).main}</a>`).join("")}</div>` : ""}`;
            box.appendChild(summary);
            summary.querySelector("#toggle-ok")?.addEventListener("click", () => { showAllOk = !showAllOk; renderWorkList(); });
        }

        function zoneAttention(zone) {
            return zone.bookcases.reduce((n, b) => n + b.levels.filter(l => WORK_STATUSES.has(l.status)).length, 0);
        }

        function renderMiniMap() {
            if (!tree.find(z => z.zone_id === activeZoneId)) {
                activeZoneId = (tree.find(z => zoneAttention(z) > 0) || tree[0])?.zone_id ?? null;
            }
            document.getElementById("zone-tabs").innerHTML = "";
            tree.forEach(zone => {
                const active = zone.zone_id === activeZoneId;
                const n = zoneAttention(zone);
                const tab = document.createElement("button");
                tab.className = `px-2.5 py-1 rounded-md ${active ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-600 hover:bg-slate-200"}`;
                tab.innerHTML = `${escapeHtml(zone.zone_code)}구역${n ? ` <span class="ml-0.5 px-1.5 rounded-full ${active ? "bg-rose-500" : "bg-rose-100 text-rose-600"}">${n}</span>` : ""}`;
                tab.addEventListener("click", () => { activeZoneId = zone.zone_id; renderMiniMap(); });
                document.getElementById("zone-tabs").appendChild(tab);
            });
            const zone = tree.find(z => z.zone_id === activeZoneId);
            const map = document.getElementById("mini-map");
            map.innerHTML = "";
            document.getElementById("zone-name").textContent = zone ? `${zone.zone_name || ""}${zone.location ? " · " + zone.location : ""}` : "";
            if (!zone) return;
            zone.bookcases.forEach(bookcase => {
                const col = document.createElement("div");
                col.className = "flex-1 min-w-[44px] flex flex-col justify-end";
                const cells = [...bookcase.levels].sort((a, b) => b.level - a.level).map(level => {
                    const st = LEVEL_STATUS[level.status];
                    const n = level.latest_session?.summary.pending_count;
                    const mark = { pending_action: n, pending_check: n, retake: "!", ok: "", no_reference: "?" }[level.status] ?? "";
                    return `<a href="${levelUrl({ shelf_id: level.shelf_id })}" title="${escapeHtml(level.location_label)} · ${st.text}"
                        class="h-7 rounded flex items-center justify-between px-1.5 text-[10px] font-semibold hover:ring-2 hover:ring-indigo-400 ${CELL[level.status]}">
                        <span class="opacity-70">${level.level}</span><span>${mark}</span></a>`;
                }).join("");
                col.innerHTML = `<div class="space-y-1">${cells || `<div class="h-7 text-[10px] text-slate-300 flex items-center justify-center">층 없음</div>`}</div>
                    <div class="text-[11px] text-center text-slate-500 mt-1.5 font-semibold">${bookcase.bookcase_no}번</div>`;
                map.appendChild(col);
            });
            const used = new Set(flattenLevels([zone]).map(l => l.status));
            document.getElementById("legend").innerHTML = Object.entries(LEVEL_STATUS).filter(([k]) => used.has(k)).map(([k, st]) =>
                `<span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-sm ${CELL[k].split(" ")[0]}"></span>${st.text}</span>`).join("");
        }

        async function refreshLocations() {
            try {
                tree = await fetchJson(`${API_BASE}/locations`);
                renderWorkList();
                renderMiniMap();
            } catch (e) {
                document.getElementById("headline").textContent = `서가 현황을 불러오지 못했습니다: ${e.message}`;
            }
        }

        function onMapLoaded(ok) {
            const img = document.getElementById("map-img");
            img.classList.toggle("hidden", !ok);
            document.getElementById("map-hint").classList.toggle("hidden", !ok);
            const empty = document.getElementById("map-empty");
            empty.classList.toggle("hidden", ok);
            if (!ok) empty.innerHTML = `<i class="fa-regular fa-map text-3xl block mb-2"></i>등록된 지도가 없습니다.`
                + (ME?.is_admin ? `<br><a href="/classic" class="text-xs text-indigo-600 font-semibold">관리 화면에서 지도 올리기</a>` : "");
            img.onclick = ok ? () => openLightbox(img.src, "도서관 전체 지도") : null;
        }

        // ===================== 순찰 사진 일괄 분석 =====================
        function setAnalyzeButton(running, enabled) {
            const btn = document.getElementById("analyze-btn");
            btn.disabled = running || !enabled;
            document.getElementById("analyze-icon").className = running ? "fa-solid fa-spinner fa-spin" : "fa-solid fa-play";
            document.getElementById("analyze-text").innerText = running ? "분석 중..." : "지금 분석";
        }

        function renderPatrolStatus(st) {
            document.getElementById("inbox-text").innerHTML = st.analyzable_count > 0
                ? `순찰 사진 <b class="text-slate-800">${st.analyzable_count}장</b> 분석 대기`
                : `새 순찰 사진 없음${st.last_received_at ? ` · 마지막 수신 ${formatTime(st.last_received_at)}` : ""}`;
            const b = st.latest_batch;
            const box = document.getElementById("inbox-progress");
            if (b && b.running) {
                const finished = b.done + b.failed;
                const pct = Math.round(finished / b.total * 100);
                box.innerHTML = `<div class="flex justify-between mb-1"><span>분석 중 ${finished} / ${b.total}${b.current_location ? " · " + escapeHtml(b.current_location) : ""}</span><span>${pct}%</span></div>
                    <div class="h-1.5 bg-slate-200 rounded-full overflow-hidden"><div class="h-full bg-indigo-500 transition-all" style="width:${pct}%"></div></div>`;
            } else if (b && b.failed) {
                box.innerHTML = `<span class="text-rose-600">마지막 분석에서 ${b.failed}장 실패 (다음 분석 때 다시 시도)</span>`;
            } else {
                box.innerHTML = "";
            }
            setAnalyzeButton(!!(b && b.running), st.analyzable_count > 0);
        }

        async function refreshPatrolStatus() {
            clearTimeout(patrolTimer);
            let st = null;
            try {
                st = await fetchJson(`${API_BASE}/patrol/status`);
                renderPatrolStatus(st);
            } catch (e) {
                document.getElementById("inbox-text").textContent = `수신함 상태를 불러오지 못했습니다: ${e.message}`;
            }
            const b = st && st.latest_batch;
            const running = !!(b && b.running);
            const progress = b ? b.done + b.failed : -1;
            if ((running && progress !== patrolProgress) || (patrolRunning && !running)) refreshLocations();
            patrolRunning = running;
            patrolProgress = progress;
            patrolTimer = setTimeout(refreshPatrolStatus, running ? POLL_MS : REFRESH_MS);
        }

        async function startBatchAnalysis() {
            setAnalyzeButton(true, true);
            try {
                await fetchJson(`${API_BASE}/patrol/analyze`, { method: "POST" });
                patrolProgress = -1;
            } catch (e) {
                alert(`일괄 분석을 시작하지 못했습니다: ${e.message}`);
            }
            refreshPatrolStatus();
        }

        // ===================== 초기화 =====================
        (async () => {
            ME = await loadMe();
            renderTopBar(ME, "home");
            document.title = `오늘의 서가 · ${ME.library_name}`;
            const now = new Date();
            document.getElementById("today").textContent =
                `${now.getMonth() + 1}월 ${now.getDate()}일 ${"일월화수목금토"[now.getDay()]}요일 · ${ME.library_name}`;
            document.getElementById("map-img").src = libraryMapUrl();
            await refreshLocations();
            refreshPatrolStatus();
        })();
        setInterval(refreshLocations, REFRESH_MS);
    </script>
</body>
</html>
