<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 서가 · 서고 모니터링</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/assets/common.js?v=20261116b"></script>
    <script src="/assets/app.js?v=20261116b"></script>
</head>
<!-- 첫 화면: "어디가 이상한가" — 층별 관리(책꽂이 모양 그대로, 칸 안에 무슨 문제인지)와 오른쪽 위 도서관 지도.
     칸의 층을 누르면 층 화면(/level)으로 이동 -->
<body class="bg-slate-50 text-slate-800 min-h-screen">
    <div id="top-bar"></div>

    <main class="max-w-6xl mx-auto px-4 md:px-8 py-6 md:py-8">
        <!-- 위쪽 줄: 제목 · 순찰 사진 분석 · 도서관 지도(오른쪽 위). 휴대폰 폭에서는 지도가 층별 관리 아래로 -->
        <div class="grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_auto_17rem] gap-x-6 gap-y-5 mb-6 items-center">
            <div class="lg:col-start-1 lg:row-start-1">
                <div id="today" class="text-sm text-slate-500"></div>
                <h1 id="headline" class="text-2xl md:text-3xl font-bold text-slate-900 mt-1">불러오는 중...</h1>
            </div>
            <!-- 순찰 사진 수신함 → 일괄 분석 -->
            <div class="lg:col-start-2 lg:row-start-1 flex flex-col items-start lg:items-end gap-1.5">
                <div class="flex items-center gap-3 text-sm text-slate-500">
                    <span id="inbox-text"></span>
                    <button id="analyze-btn" onclick="startBatchAnalysis()" disabled
                            class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2.5 rounded-xl flex items-center gap-1.5 whitespace-nowrap disabled:bg-slate-300 disabled:cursor-not-allowed">
                        <i id="analyze-icon" class="fa-solid fa-play"></i> <span id="analyze-text">지금 분석</span>
                    </button>
                </div>
                <div id="inbox-progress" class="text-xs text-slate-500 w-72 max-w-full"></div>
            </div>

            <!-- 도서관 지도 -->
            <aside class="order-last lg:order-none lg:col-start-3 lg:row-start-1 self-stretch">
                <div class="h-full bg-white rounded-2xl border border-slate-200 p-3 md:p-4">
                    <div class="flex items-center gap-2 mb-2">
                        <h2 class="font-extrabold text-sm md:text-base">도서관 지도</h2>
                        <span id="map-hint" class="text-xs text-slate-400 hidden"><i class="fa-solid fa-magnifying-glass-plus"></i> 눌러서 크게</span>
                    </div>
                    <img id="map-img" alt="도서관 전체 지도" class="hidden w-full rounded-lg border border-slate-100 cursor-zoom-in"
                         onload="onMapLoaded(true)" onerror="onMapLoaded(false)">
                    <div id="map-empty" class="text-sm text-slate-400 text-center py-3"><i class="fa-regular fa-map text-2xl block mb-1"></i>등록된 지도가 없습니다.</div>
                </div>
            </aside>

            <!-- 층별 관리: 화면에서 가장 크게. 책꽂이를 실제처럼 세워 놓고(맨 위가 가장 높은 층) 칸 안에 문제를 바로 적음 -->
            <section class="lg:col-span-3 lg:row-start-2 min-w-0 bg-white rounded-2xl border border-slate-200 p-4 md:p-6">
                <div class="flex flex-wrap items-center gap-x-4 gap-y-2 mb-4 md:mb-5">
                    <h2 class="text-lg md:text-xl font-extrabold">층별 관리</h2>
                    <div id="zone-tabs" class="flex flex-wrap gap-1.5 text-sm font-bold"></div>
                    <span id="zone-name" class="text-sm text-slate-400"></span>
                    <div id="legend" class="lg:ml-auto flex flex-wrap gap-x-3.5 gap-y-1 text-xs text-slate-500"></div>
                </div>
                <div id="board" class="overflow-x-auto pb-1"></div>
                <div class="flex flex-wrap justify-between gap-2 mt-4 text-xs md:text-sm text-slate-500">
                    <span>칸을 누르면 그 층의 사진과 문제 책 위치로 이동해요 · <span id="board-axis-hint"></span></span>
                    <span id="board-summary"></span>
                </div>
            </section>
        </div>
    </main>

    <script>
        const REFRESH_MS = 20000;
        const POLL_MS = 3000;
        let ME = null;
        let tree = [];
        let activeZoneId = null;
        let patrolRunning = false;
        let patrolProgress = -1;
        let patrolTimer = null;

        // 층별 관리 칸 모양 (상태 판정은 서버 main.level_status)
        const BOARD_CELL = {
            pending_action: { cls: "bg-rose-50 border-2 border-rose-400 shadow-[0_4px_14px_rgba(244,63,94,.15)]", tag: "text-rose-600", icon: "fa-circle-exclamation", text: "조치 필요", swatch: "bg-rose-400" },
            retake:         { cls: "bg-orange-50 border-2 border-orange-400", tag: "text-orange-600", icon: "fa-camera-rotate", text: "다시 찍기", swatch: "bg-orange-400", legend: "사진 다시" },
            pending_check:  { cls: "bg-yellow-50 border-[1.5px] border-yellow-300", tag: "text-yellow-700", icon: "fa-eye", text: "확인만", swatch: "bg-yellow-300" },
            no_reference:   { cls: "bg-violet-50 border-[1.5px] border-dashed border-violet-300", tag: "text-violet-700", icon: "fa-image", text: "기준 사진 없음", swatch: "bg-violet-300" },
            ok:             { cls: "bg-emerald-50", swatch: "bg-emerald-200", legend: "정상" },
            unpatrolled:    { cls: "bg-[repeating-linear-gradient(135deg,#f1f5f9_0_8px,#e9eef4_8px_16px)]", swatch: "bg-slate-200", legend: "순찰 안 함" },
            no_books:       { cls: "bg-slate-50 border border-slate-100", swatch: "bg-slate-100", legend: "도서 없음" },
        };

        // 칸 · 표에 쓰는 문제 칩 (오배가 2, 분실 위험 1 …)
        function issueChips(level, size = "text-[11.5px] px-1.5 py-0.5") {
            const byGroup = level.latest_session?.summary.pending_by_group || {};
            return DASHBOARD_GROUP_ORDER.filter(g => byGroup[g.key]).map(g =>
                `<span class="${size} font-bold rounded-md whitespace-nowrap ${g.badge}">${g.title} ${byGroup[g.key]}</span>`).join("");
        }

        function boardCell(level) {
            const st = BOARD_CELL[level.status] || BOARD_CELL.no_books;
            const base = "block h-20 md:h-24 rounded-xl p-2 md:p-2.5 hover:ring-2 hover:ring-indigo-300 transition";
            const href = levelUrl(level);
            let title = `${level.location_label} · ${LEVEL_STATUS[level.status]?.text || ""}`;
            if (level.status === "ok") {
                return `<a href="${href}" title="${escapeHtml(title)}" class="${base} ${st.cls} flex items-center justify-center gap-1.5 text-sm font-semibold text-emerald-600">
                    <i class="fa-solid fa-check"></i> 정상 <span class="text-emerald-300 font-medium">${level.book_count}권</span></a>`;
            }
            if (level.status === "unpatrolled" || level.status === "no_books") {
                return `<a href="${href}" title="${escapeHtml(title)}" class="${base} ${st.cls} flex items-center justify-center text-xs md:text-sm text-slate-400">
                    ${level.status === "unpatrolled" ? "순찰 사진 없음" : "도서 없음"}</a>`;
            }
            const go = WORK_STATUSES.has(level.status)
                ? `<span class="hidden md:inline text-[11.5px] font-bold ${st.tag} whitespace-nowrap">보러 가기 <i class="fa-solid fa-arrow-right"></i></span>` : "";
            let body = "";
            if (level.status === "retake") {
                const reason = level.latest_session?.quality?.reasons?.[0];
                body = reason ? `<div class="text-[11px] text-orange-800 leading-snug line-clamp-2">${escapeHtml(reason)}</div>` : "";
            } else if (level.status === "no_reference") {
                body = `<div class="text-[11px] text-violet-700 leading-snug">${ME.is_admin ? "관리 화면에서 등록" : "관리자에게 알려 주세요"}</div>`;
            } else {
                // 칸 높이에 다 안 들어가면 fitCellChips()가 뒤쪽 칩을 숨기고 "+N"으로 줄임 (전체는 칸의 title 툴팁)
                body = `<div class="cell-chips flex flex-wrap content-start gap-1 flex-1 min-h-0 overflow-hidden">${issueChips(level)}</div>`;
                const byGroup = level.latest_session?.summary.pending_by_group || {};
                const all = DASHBOARD_GROUP_ORDER.filter(g => byGroup[g.key]).map(g => `${g.title} ${byGroup[g.key]}`).join(", ");
                if (all) title += ` (${all})`;
            }
            return `<a href="${href}" title="${escapeHtml(title)}" class="${base} ${st.cls} flex flex-col gap-1.5 overflow-hidden">
                <div class="flex items-center justify-between gap-1">
                    <span class="text-xs md:text-[13px] font-extrabold ${st.tag} flex items-center gap-1 whitespace-nowrap"><i class="fa-solid ${st.icon}"></i> ${st.text}</span>${go}
                </div>${body}</a>`;
        }

        // 칸에 다 안 들어가는 문제 칩은 앞에서부터 들어가는 만큼만 보이고 마지막에 "+N" (나머지 개수)
        // (칸 크기가 정해지거나 바뀔 때마다 다시 맞춤: 스타일이 늦게 적용되거나 창 크기가 바뀌어도 맞게)
        function fitChipBox(box) {
            const chips = [...box.children].filter(c => !c.classList.contains("chip-more"));
            chips.forEach(c => c.classList.remove("hidden"));
            box.querySelector(".chip-more")?.remove();
            const overflows = () => box.scrollHeight > box.clientHeight + 1;
            if (!overflows()) return;
            const more = document.createElement("span");
            more.className = "chip-more text-[11.5px] px-1.5 py-0.5 font-bold rounded-md whitespace-nowrap bg-slate-200 text-slate-600";
            box.appendChild(more);
            for (let shown = chips.length - 1; shown >= 1; shown--) {
                chips[shown].classList.add("hidden");
                more.textContent = `+${chips.length - shown}`;
                if (!overflows()) break;
            }
        }
        const chipObserver = new ResizeObserver(entries => entries.forEach(e => fitChipBox(e.target)));
        function fitCellChips() {
            chipObserver.disconnect();
            document.querySelectorAll("#board .cell-chips").forEach(box => chipObserver.observe(box));
        }

        function zoneAttention(zone) {
            return zone.bookcases.reduce((n, b) => n + b.levels.filter(l => WORK_STATUSES.has(l.status)).length, 0);
        }

        function renderBoard() {
            if (!tree.find(z => z.zone_id === activeZoneId)) {
                activeZoneId = (tree.find(z => zoneAttention(z) > 0) || tree[0])?.zone_id ?? null;
            }
            const tabs = document.getElementById("zone-tabs");
            tabs.innerHTML = "";
            tree.forEach(zone => {
                const active = zone.zone_id === activeZoneId;
                const n = zoneAttention(zone);
                const tab = document.createElement("button");
                tab.className = `px-3.5 py-1.5 rounded-lg flex items-center gap-1.5 ${active ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-600 hover:bg-slate-200"}`;
                tab.innerHTML = `${escapeHtml(zone.zone_code)}구역${n ? ` <span class="text-[11px] px-1.5 rounded-full bg-rose-500 text-white">${n}</span>` : ""}`;
                tab.addEventListener("click", () => { activeZoneId = zone.zone_id; renderBoard(); });
                tabs.appendChild(tab);
            });

            const zone = tree.find(z => z.zone_id === activeZoneId);
            const board = document.getElementById("board");
            document.getElementById("zone-name").textContent = zone ? [zone.zone_name, zone.location].filter(Boolean).join(" · ") : "";
            board.innerHTML = "";
            if (!zone) {
                document.getElementById("board-summary").textContent = "";
                board.innerHTML = `<div class="text-center text-sm text-slate-500 py-10">
                    ${ME.is_admin ? `<a href="/manage" class="text-indigo-600 font-semibold">관리 화면</a>에서 구역 · 책꽂이 · 층을 먼저 만들어 주세요.` : "관리자가 도서관 구조를 등록하면 여기에 표시됩니다."}</div>`;
                return;
            }
            const levels = flattenLevels([zone]);
            const top = Math.max(1, ...levels.map(l => l.level));
            const bookcases = zone.bookcases;
            // 왼쪽 층 번호 + 책꽂이 칸 (한 책꽂이에 없는 층은 빈 자리)
            const axis = Array.from({ length: top }, (_, i) =>
                `<div class="h-20 md:h-24 flex items-center text-xs md:text-sm font-bold text-slate-400">${top - i}층</div>`).join("");
            const cases = bookcases.map(b => {
                const byLevel = Object.fromEntries(b.levels.map(l => [l.level, { ...l, zone, bookcase: b }]));
                const bad = b.levels.filter(l => WORK_STATUSES.has(l.status)).length;
                const badge = bad ? `<span class="ml-auto text-xs font-bold px-2 rounded-full bg-rose-500 text-white">${bad}</span>`
                    : b.levels.some(l => l.status === "ok") ? `<span class="ml-auto text-xs px-1.5 rounded-full bg-emerald-100 text-emerald-600"><i class="fa-solid fa-check"></i></span>` : "";
                const cells = Array.from({ length: top }, (_, i) => {
                    const level = byLevel[top - i];
                    return level ? boardCell(level) : `<div class="h-20 md:h-24"></div>`;
                }).join("");
                return `<div class="bg-slate-50 border border-slate-200 rounded-2xl p-1.5 md:p-2 min-w-[150px] flex-1">
                    <div class="h-7 flex items-center gap-1.5 px-1 mb-1.5 text-xs md:text-sm">
                        <span class="text-slate-400 font-semibold">${escapeHtml(b.bookcase_code || "")}</span>
                        <b class="text-slate-700">${b.bookcase_no}번 책꽂이</b>${badge}</div>
                    <div class="flex flex-col gap-1.5 md:gap-2">${cells}</div></div>`;
            }).join("");
            board.innerHTML = bookcases.length
                ? `<div class="flex gap-2 md:gap-3 min-w-max lg:min-w-0">
                       <div class="flex flex-col gap-1.5 md:gap-2 pt-[38px] md:pt-[46px] w-8 md:w-10 shrink-0">${axis}</div>
                       <div class="flex gap-2 md:gap-3 flex-1">${cases}</div></div>`
                : `<div class="text-sm text-slate-400 text-center py-10">이 구역에는 아직 책꽂이가 없습니다.</div>`;
            fitCellChips();

            document.getElementById("board-axis-hint").textContent = `맨 위가 ${top}층, 맨 아래가 1층`;
            const count = s => levels.filter(l => l.status === s).length;
            const bad = levels.filter(l => WORK_STATUSES.has(l.status)).length;
            document.getElementById("board-summary").innerHTML = `${escapeHtml(zone.zone_code)}구역 ${levels.length}층 중 `
                + (bad ? `<b class="text-rose-600">문제 ${bad}층</b>` : `<b class="text-emerald-600">문제 없음</b>`)
                + ` · 정상 ${count("ok")}` + (count("unpatrolled") ? ` · 순찰 안 함 ${count("unpatrolled")}` : "");

            const used = new Set(levels.map(l => l.status));
            document.getElementById("legend").innerHTML = Object.entries(BOARD_CELL).filter(([k]) => used.has(k)).map(([k, st]) =>
                `<span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm ${st.swatch}"></span>${st.legend || st.text}</span>`).join("");
        }

        // 제목 문구: 정리가 필요한 층 수 (어느 층인지는 층별 관리 칸에 바로 보임)
        function renderHeadline() {
            const levels = flattenLevels(tree);
            const work = levels.filter(l => WORK_STATUSES.has(l.status));
            document.getElementById("headline").innerHTML = levels.length === 0
                ? "등록된 서가가 없어요"
                : work.length ? `정리가 필요한 곳 <span class="text-rose-600">${work.length}층</span>` : `오늘은 정리할 곳이 없어요 <span class="text-emerald-600">✓</span>`;
        }

        async function refreshLocations() {
            try {
                tree = await fetchJson(`${API_BASE}/locations`);
                renderHeadline();
                renderBoard();
            } catch (e) {
                document.getElementById("headline").textContent = `서가 현황을 불러오지 못했습니다: ${e.message}`;
            }
        }

        function onMapLoaded(ok) {
            const img = document.getElementById("map-img");
            img.classList.toggle("hidden", !ok);
            document.getElementById("map-hint").classList.toggle("hidden", !ok);
            const empty = document.getElementById("map-empty");
            empty.classList.toggle("hidden", ok);
            if (!ok) empty.innerHTML = `<i class="fa-regular fa-map text-3xl block mb-2"></i>등록된 지도가 없습니다.`
                + (ME?.is_admin ? `<br><a href="/manage" class="text-xs text-indigo-600 font-semibold">관리 화면에서 지도 올리기</a>` : "");
            img.onclick = ok ? () => openLightbox(img.src, "도서관 전체 지도") : null;
        }

        // ===================== 순찰 사진 일괄 분석 =====================
        function setAnalyzeButton(running, enabled) {
            const btn = document.getElementById("analyze-btn");
            btn.disabled = running || !enabled;
            document.getElementById("analyze-icon").className = running ? "fa-solid fa-spinner fa-spin" : "fa-solid fa-play";
            document.getElementById("analyze-text").innerText = running ? "분석 중..." : "지금 분석";
        }

        function renderPatrolStatus(st) {
            document.getElementById("inbox-text").innerHTML = st.analyzable_count > 0
                ? `순찰 사진 <b class="text-slate-800">${st.analyzable_count}장</b> 분석 대기`
                : `새 순찰 사진 없음${st.last_received_at ? ` · 마지막 수신 ${formatTime(st.last_received_at)}` : ""}`;
            const b = st.latest_batch;
            const box = document.getElementById("inbox-progress");
            if (b && b.running) {
                const finished = b.done + b.failed;
                const pct = Math.round(finished / b.total * 100);
                box.innerHTML = `<div class="flex justify-between mb-1"><span>분석 중 ${finished} / ${b.total}${b.current_location ? " · " + escapeHtml(b.current_location) : ""}</span><span>${pct}%</span></div>
                    <div class="h-1.5 bg-slate-200 rounded-full overflow-hidden"><div class="h-full bg-indigo-500 transition-all" style="width:${pct}%"></div></div>`;
            } else if (b && b.failed) {
                box.innerHTML = `<span class="text-rose-600">마지막 분석에서 ${b.failed}장 실패 (다음 분석 때 다시 시도)</span>`;
            } else {
                box.innerHTML = "";
            }
            setAnalyzeButton(!!(b && b.running), st.analyzable_count > 0);
        }

        async function refreshPatrolStatus() {
            clearTimeout(patrolTimer);
            let st = null;
            try {
                st = await fetchJson(`${API_BASE}/patrol/status`);
                renderPatrolStatus(st);
            } catch (e) {
                document.getElementById("inbox-text").textContent = `수신함 상태를 불러오지 못했습니다: ${e.message}`;
            }
            const b = st && st.latest_batch;
            const running = !!(b && b.running);
            const progress = b ? b.done + b.failed : -1;
            if ((running && progress !== patrolProgress) || (patrolRunning && !running)) refreshLocations();
            patrolRunning = running;
            patrolProgress = progress;
            patrolTimer = setTimeout(refreshPatrolStatus, running ? POLL_MS : REFRESH_MS);
        }

        async function startBatchAnalysis() {
            setAnalyzeButton(true, true);
            try {
                await fetchJson(`${API_BASE}/patrol/analyze`, { method: "POST" });
                patrolProgress = -1;
            } catch (e) {
                alert(`일괄 분석을 시작하지 못했습니다: ${e.message}`);
            }
            refreshPatrolStatus();
        }

        // ===================== 초기화 =====================
        (async () => {
            ME = await loadMe();
            renderTopBar(ME, "home");
            document.title = `오늘의 서가 · ${ME.library_name}`;
            const now = new Date();
            document.getElementById("today").textContent =
                `${now.getMonth() + 1}월 ${now.getDate()}일 ${"일월화수목금토"[now.getDay()]}요일 · ${ME.library_name}`;
            document.getElementById("map-img").src = libraryMapUrl();
            await refreshLocations();
            refreshPatrolStatus();
        })();
        setInterval(refreshLocations, REFRESH_MS);
    </script>
</body>
</html>
